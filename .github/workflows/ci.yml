name: CI

# VOUCH-6 — "tests pass on my machine" is not a solid MVP claim; a green
# check on every push and PR is. Runs the full engine + server test suite
# (36 tests as of this workflow's introduction) plus a build check on the
# web console, on every push to main and every pull request.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Seed the database
        run: npm run seed

      - name: Run test suite
        run: npm test

      - name: Build web console
        run: npm --workspace web run build

  extension-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate manifest.json is well-formed
        run: node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json', 'utf8')); console.log('manifest.json OK')"

      - name: Validate selectors.json is well-formed
        run: node -e "JSON.parse(require('fs').readFileSync('server/selectors.json', 'utf8')); console.log('selectors.json OK')"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Package the extension
        run: npm run package:extension
